[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoscratch-flow-field-tiles"
version = "0.5.0"
description = "Deterministic velocity-only COG collection backend for GeoScratch Flow Field"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "morecantile==7.0.3",
    "numpy==2.4.6",
    "rasterio==1.5.0",
    "rio-cogeo==7.0.2",
    "scipy==1.18.1",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[project.scripts]
flow-field-tile-build = "geoscratch_flow_field_tiles.build:main"
flow-field-cog-build = "geoscratch_flow_field_tiles.cog:main"
flow-field-cog-collection-build = "geoscratch_flow_field_tiles.collection:main"
flow-field-source-describe = "geoscratch_flow_field_tiles.descriptor:main"
flow-field-tile-serve = "geoscratch_flow_field_tiles.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
